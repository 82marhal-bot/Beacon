name: Build and deploy to App Service

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-clo25-martina                      
  AZURE_WEBAPP_HOSTNAME: app-clo25-martina.azurewebsites.net  
  AZURE_RESOURCE_GROUP: rg-clo25-martina
  DOTNET_VERSION: '10.0.x'

jobs:

  infra:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy the infrastructure
        run: |
          chmod +x ./scripts/deploy-infra.sh
          ./scripts/deploy-infra.sh "${{ env.AZURE_RESOURCE_GROUP }}"

  infra-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Preview the infrastructure changes
        run: |
          set -o pipefail
          chmod +x ./scripts/deploy-infra.sh
          ./scripts/deploy-infra.sh --what-if "${{ env.AZURE_RESOURCE_GROUP }}" | tee whatif.txt

      - name: Comment the preview on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Förhandsgranskning av infrastrukturen'
            echo
            sed 's/^/    /' whatif.txt
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Publish the app
        run: |
          dotnet publish ./src/Beacon.Api/Beacon.Api.csproj \
            --configuration Release \
            --output artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: artifacts/publish
          
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (needed for the script)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app
          path: artifacts/publish

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: artifacts/publish

      - name: Health check after deployment
        run: |
          URL="https://${{ env.AZURE_WEBAPP_HOSTNAME }}/health"
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh "$URL"